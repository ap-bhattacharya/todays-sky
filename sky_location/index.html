<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: transparent; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { overflow: hidden; }
button {
  width: 100%;
  height: 42px;
  border: 1px solid rgba(148,163,184,.20);
  border-radius: 12px;
  background: rgba(15,23,42,.72);
  color: #f8fafc;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background .18s ease, border-color .18s ease, transform .12s ease;
}
button:hover { background: rgba(30,41,59,.95); border-color: rgba(96,165,250,.45); }
button:active { transform: translateY(1px); }
button:disabled { cursor: wait; opacity: .72; }
.status {
  height: 42px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  border: 1px solid rgba(96,165,250,.22);
  border-radius: 12px;
  background: rgba(30,64,175,.12);
  color: #93c5fd;
  font-size: 13px;
}
</style>
</head>
<body>
<button id="locationButton" type="button">📍 Use my location</button>
<script>
const Streamlit = {
  setComponentValue(value) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setComponentValue",
      value: value
    }, "*");
  },
  setFrameHeight(height) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setFrameHeight",
      height: height
    }, "*");
  },
  componentReady() {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:componentReady",
      apiVersion: 1
    }, "*");
  }
};

const button = document.getElementById("locationButton");
const label = new URLSearchParams(window.location.search).get("button_label");
if (label) button.textContent = label;

Streamlit.componentReady();
Streamlit.setFrameHeight(42);

button.addEventListener("click", () => {
  if (!navigator.geolocation) {
    Streamlit.setComponentValue({
      error: { code: 0, message: "Geolocation is not supported by this browser." }
    });
    return;
  }

  button.disabled = true;
  button.textContent = "📍 Finding your location…";

  navigator.geolocation.getCurrentPosition(
    (position) => {
      Streamlit.setComponentValue({
        latitude: position.coords.latitude,
        longitude: position.coords.longitude,
        accuracy: position.coords.accuracy,
        timestamp: position.timestamp
      });
      button.textContent = "✓ Location detected";
    },
    (error) => {
      Streamlit.setComponentValue({
        error: { code: error.code, message: error.message }
      });
      button.disabled = false;
      button.textContent = "📍 Use my location";
    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
});
</script>
</body>
</html>
